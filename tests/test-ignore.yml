name: Test ignore input to skip specified paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create HCL files for ignore test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-hcl-ignore/ignored"
          mkdir -p "$GITHUB_WORKSPACE/test-hcl-ignore/processed"
          printf 'locals {\n  name    = "processed"\n  enabled = true\n}\n' \
            > "$GITHUB_WORKSPACE/test-hcl-ignore/processed/good.hcl"
          printf 'locals {\n  name    = "ignored"\n  enabled = true\n}\n' \
            > "$GITHUB_WORKSPACE/test-hcl-ignore/ignored/skip.hcl"

      - id: action
        uses: .
        with:
          dir: test-hcl-ignore
          ignore: "test-hcl-ignore/ignored"
          write: "true"
          recursive: "true"
          list: "false"
          diff: "false"
          check: "false"

      - name: Assert ignore mode completed successfully
        run: |
          echo "PASS: action ran successfully with ignore path specified"
