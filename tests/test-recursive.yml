name: Test recursive processing of subdirectories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create nested HCL files for recursive test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-hcl-recursive/subdir"
          printf 'locals {\n  name = "root"\n}\n' \
            > "$GITHUB_WORKSPACE/test-hcl-recursive/root.hcl"
          printf 'locals {\n  name = "nested"\n}\n' \
            > "$GITHUB_WORKSPACE/test-hcl-recursive/subdir/nested.hcl"

      - id: action
        uses: .
        with:
          dir: test-hcl-recursive
          recursive: "true"
          write: "true"
          list: "false"
          diff: "false"
          check: "false"

      - name: Assert recursive mode completed successfully
        run: |
          echo "PASS: recursive mode ran successfully on nested HCL files"
