name: Test HCL list mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create HCL file with formatting issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hcl-list"
          printf 'resource "aws_instance" "example" {\nami = "ami-0c55b159cbfafe1f0"\ninstance_type = "t2.micro"\n}\n' > "$GITHUB_WORKSPACE/hcl-list/main.tf"

      - id: action
        uses: .
        with:
          dir: ./hcl-list
          list: "true"
          write: "false"
          recursive: "true"

      - name: Assert action completed in list mode
        env:
          FILES_CHANGED: ${{ steps.action.outputs.files_changed }}
        run: |
          echo "files_changed: $FILES_CHANGED"
          echo "PASS: list mode completed successfully"
