name: Test check mode with well-formatted files (should pass)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a well-formatted HCL file for check mode test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-hcl-check"
          printf 'locals {\n  name    = "example"\n  enabled = true\n}\n' \
            > "$GITHUB_WORKSPACE/test-hcl-check/good.hcl"

      - id: action
        uses: .
        with:
          dir: test-hcl-check
          check: "true"
          write: "false"
          recursive: "true"
          list: "false"
          diff: "false"

      - name: Assert check mode passed on well-formatted files
        run: |
          echo "PASS: check mode succeeded on well-formatted HCL files"
